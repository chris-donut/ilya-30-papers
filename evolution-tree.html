<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ilya's 30 Papers — Research Evolution Tree</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg-deep:#0b0b0b;--bg-surface:#111116;--bg-card:#1b1b1b;
  --text-primary:#f1f1f1;--text-secondary:#a6a6a6;--text-tertiary:#8c8c8c;
  --purple-primary:#acaaff;--purple-light:#7255e7;--purple-dark:#312b48;
  --green:#0dc95c;--orange:#fea149;--red:#ec4d4d;
  --border:rgba(153,151,255,0.2);--glow:inset 0 0 12px 0 rgba(153,151,255,0.4);
  --font-sans:'Open Sans',system-ui,sans-serif;
  --font-mono:'JetBrains Mono',monospace;
  --header-h:90px;
}
html,body{height:100%;overflow:hidden;background:var(--bg-deep);color:var(--text-primary);font-family:var(--font-sans);}
#app{display:flex;flex-direction:column;height:100vh;overflow:hidden;}

/* ── HEADER ── */
#app-header{
  height:var(--header-h);min-height:var(--header-h);
  background:var(--bg-surface);
  border-bottom:1px solid var(--border);
  display:flex;flex-direction:column;justify-content:space-between;
  padding:10px 20px 0;z-index:100;flex-shrink:0;
}
.header-top{display:flex;align-items:center;justify-content:space-between;gap:16px;}
.app-title{
  font-size:18px;font-weight:700;letter-spacing:-0.3px;
  display:flex;align-items:center;gap:10px;
  background:linear-gradient(90deg,#f1f1f1 0%,#acaaff 60%,#7255e7 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.app-title .donut-emoji{-webkit-text-fill-color:initial;font-size:20px;}
.app-subtitle{font-size:13px;font-weight:400;color:var(--text-secondary);-webkit-text-fill-color:var(--text-secondary);margin-left:4px;}

/* Zoom controls */
.zoom-controls{display:flex;align-items:center;gap:6px;flex-shrink:0;}
.zoom-btn{
  background:var(--bg-card);border:1px solid var(--border);color:var(--text-primary);
  font-size:14px;font-weight:600;width:28px;height:28px;border-radius:6px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:all 0.15s;
  font-family:var(--font-sans);
}
.zoom-btn:hover{background:var(--purple-dark);border-color:var(--purple-primary);}
.zoom-label{font-size:12px;color:var(--text-secondary);font-family:var(--font-mono);width:36px;text-align:center;}

/* Filter tabs */
.filter-bar{display:flex;gap:4px;align-items:center;padding-bottom:8px;overflow-x:auto;flex-wrap:nowrap;}
.filter-bar::-webkit-scrollbar{height:0;}
.filter-tab{
  position:relative;background:transparent;border:none;
  color:var(--text-secondary);font-size:12px;font-weight:500;
  padding:4px 12px;border-radius:20px;cursor:pointer;
  white-space:nowrap;transition:all 0.18s;font-family:var(--font-sans);
  border:1px solid transparent;
}
.filter-tab::before{
  content:'';position:absolute;inset:-1px;border-radius:20px;
  background:linear-gradient(90deg,#588AFD,#ACAAFF,#4800FB);
  opacity:0;transition:opacity 0.18s;z-index:-1;
}
.filter-tab::after{
  content:'';position:absolute;inset:0px;border-radius:20px;
  background:var(--bg-card);z-index:-1;
}
.filter-tab:hover{color:var(--text-primary);}
.filter-tab:hover::before{opacity:0.4;}
.filter-tab.active{color:var(--text-primary);}
.filter-tab.active::before{opacity:1;}
.tab-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle;}

/* ── MAIN BODY ── */
#app-body{
  display:flex;flex:1;overflow:hidden;
}

/* ── CANVAS AREA ── */
#canvas-outer{
  flex:1;overflow:hidden;position:relative;
  background:var(--bg-deep);
}
#canvas-scroller{
  width:100%;height:100%;overflow:auto;
  cursor:default;
}
#canvas-scroller::-webkit-scrollbar{width:8px;height:8px;}
#canvas-scroller::-webkit-scrollbar-track{background:var(--bg-surface);}
#canvas-scroller::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
#canvas-size-shim{/* sized by JS */position:relative;}
#canvas{
  position:absolute;top:0;left:0;
  transform-origin:top left;
}

/* ── SVG CONNECTION LAYER ── */
#connections-svg{
  position:absolute;top:0;left:0;
  pointer-events:none;overflow:visible;
}
.conn-path{
  fill:none;stroke-width:1.5;
  transition:opacity 0.25s,stroke-width 0.25s;
}
.conn-same{stroke-dasharray:none;}
.conn-cross{stroke-dasharray:6,4;}
.conn-path.faded{opacity:0.08;}
.conn-path.highlighted{stroke-width:2.5;opacity:1!important;}

/* ── YEAR AXIS ── */
#year-axis{position:absolute;top:0;left:0;right:0;pointer-events:none;}
.year-mark{
  position:absolute;top:0;
  display:flex;flex-direction:column;align-items:center;
  transform:translateX(-50%);
}
.year-label{font-size:10px;color:var(--text-tertiary);font-family:var(--font-mono);white-space:nowrap;}
.year-tick{width:1px;height:8px;background:var(--border);}

/* ── THREAD LANES ── */
#thread-lanes{position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none;}
.thread-lane{position:absolute;left:0;right:0;display:flex;align-items:center;}
.lane-label{
  position:sticky;left:0;z-index:20;
  font-size:11px;font-weight:600;letter-spacing:0.3px;
  text-transform:uppercase;padding:0 10px;
  background:linear-gradient(to right, var(--bg-deep) 80%, transparent);
  white-space:nowrap;cursor:default;
}
.lane-line{
  position:absolute;height:1px;
  transition:opacity 0.25s;
}
.thread-lane.hidden{opacity:0.1;}

/* ── PAPER NODES ── */
.paper-node{
  position:absolute;
  border-radius:50%;
  background:var(--bg-card);
  border:2px solid var(--node-color,#acaaff);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-mono);font-size:9px;font-weight:700;
  color:var(--node-color,#acaaff);
  cursor:pointer;
  transform:translate(-50%,-50%);
  transition:transform 0.18s,box-shadow 0.18s,opacity 0.25s;
  z-index:30;
  user-select:none;
}
.paper-node:hover{
  transform:translate(-50%,-50%) scale(1.2);
  box-shadow:0 0 16px 4px var(--node-color,#acaaff);
  z-index:50;
}
.paper-node.active{
  border-width:3px;
  box-shadow:0 0 20px 6px var(--node-color,#acaaff);
  z-index:50;
}
.paper-node.faded{opacity:0.15;}

/* Frontier glow animation */
@keyframes frontier-pulse{
  0%,100%{box-shadow:0 0 6px 1px var(--node-color,#acaaff);}
  50%{box-shadow:0 0 20px 8px var(--node-color,#acaaff),0 0 40px 12px color-mix(in srgb,var(--node-color,#acaaff) 30%,transparent);}
}
.paper-node.frontier-active{
  animation:frontier-pulse 2.5s ease-in-out infinite;
}
.paper-node.active.frontier-active{animation:none;}

/* Milestone dots */
.milestone-dot{
  position:absolute;
  width:6px;height:6px;border-radius:50%;
  transform:translate(-50%,-50%);
  cursor:default;z-index:25;
  transition:opacity 0.25s,transform 0.18s;
  border:1px solid rgba(255,255,255,0.2);
}
.milestone-dot:hover{transform:translate(-50%,-50%) scale(2);z-index:40;}
.milestone-dot.faded{opacity:0.06;}

/* ── TOOLTIP ── */
#tooltip{
  position:fixed;z-index:999;
  background:var(--bg-card);
  border:1px solid var(--border);
  border-radius:10px;
  padding:10px 14px;
  max-width:260px;
  pointer-events:none;
  opacity:0;transition:opacity 0.15s;
  box-shadow:0 8px 32px rgba(0,0,0,0.5),var(--glow);
}
#tooltip.visible{opacity:1;}
.tt-num{font-family:var(--font-mono);font-size:10px;color:var(--text-tertiary);margin-bottom:3px;}
.tt-title{font-size:13px;font-weight:600;color:var(--text-primary);margin-bottom:4px;line-height:1.3;}
.tt-year{font-size:11px;color:var(--text-secondary);margin-bottom:4px;}
.tt-summary{font-size:11px;color:var(--text-secondary);line-height:1.45;}
.tt-thread{font-size:10px;font-weight:600;margin-top:6px;text-transform:uppercase;letter-spacing:0.4px;}

/* ── DETAIL PANEL ── */
#detail-panel{
  width:400px;min-width:400px;max-width:400px;
  background:var(--bg-surface);
  border-left:1px solid var(--border);
  display:flex;flex-direction:column;
  overflow:hidden;
  transition:width 0.3s;
}
#detail-empty{
  flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:8px;padding:40px;text-align:center;
}
.empty-icon{font-size:40px;margin-bottom:8px;}
#detail-empty p{color:var(--text-secondary);font-size:14px;}
#detail-empty .hint{font-size:12px;color:var(--text-tertiary);}
#detail-content{flex:1;overflow-y:auto;display:none;}
#detail-content::-webkit-scrollbar{width:4px;}
#detail-content::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}

/* Detail panel header */
.dp-header{
  padding:16px 16px 12px;
  border-bottom:1px solid var(--border);
  position:sticky;top:0;
  background:var(--bg-surface);z-index:10;
}
.dp-header-top{display:flex;align-items:flex-start;gap:12px;}
.dp-num{
  font-family:var(--font-mono);font-size:20px;font-weight:700;
  color:var(--dp-color,#acaaff);
  line-height:1;margin-top:2px;flex-shrink:0;
}
.dp-title{font-size:15px;font-weight:700;line-height:1.35;color:var(--text-primary);flex:1;}
.dp-close{
  background:transparent;border:none;color:var(--text-tertiary);
  font-size:20px;cursor:pointer;width:28px;height:28px;
  display:flex;align-items:center;justify-content:center;
  border-radius:6px;transition:all 0.15s;flex-shrink:0;
}
.dp-close:hover{background:var(--bg-card);color:var(--text-primary);}
.dp-meta{display:flex;align-items:center;gap:8px;margin-top:6px;}
.dp-year{
  font-size:12px;font-family:var(--font-mono);color:var(--text-secondary);
}
.dp-thread-badge{
  font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;
  padding:2px 8px;border-radius:10px;
  border:1px solid var(--dp-color,#acaaff);
  color:var(--dp-color,#acaaff);
}
.dp-frontier-badge{
  font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.3px;
  padding:2px 8px;border-radius:10px;
  background:linear-gradient(166deg,#588afd,#4800fb);
  color:white;
}
.dp-summary{
  padding:10px 16px 0;
  font-size:12px;color:var(--text-secondary);font-style:italic;line-height:1.5;
}

/* Detail sections */
.dp-section{padding:14px 16px;border-bottom:1px solid var(--border);}
.dp-section:last-child{border-bottom:none;}
.dp-section-title{
  font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;
  color:var(--text-tertiary);margin-bottom:8px;display:flex;align-items:center;gap:6px;
}
.dp-section-body{font-size:13px;color:var(--text-secondary);line-height:1.6;}

/* Evolution list */
.dp-evolution{list-style:none;display:flex;flex-direction:column;gap:7px;}
.dp-evo-item{display:flex;gap:10px;align-items:flex-start;}
.dp-evo-year{
  font-family:var(--font-mono);font-size:11px;font-weight:700;
  color:var(--dp-color,#acaaff);flex-shrink:0;width:32px;line-height:1.6;
}
.dp-evo-text{font-size:12px;color:var(--text-secondary);line-height:1.55;}

/* Connected papers */
.dp-connected{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px;}
.dp-conn-chip{
  font-family:var(--font-mono);font-size:11px;font-weight:700;
  padding:4px 10px;border-radius:6px;cursor:pointer;
  border:1px solid var(--chip-color,#acaaff);
  color:var(--chip-color,#acaaff);
  background:transparent;
  transition:all 0.15s;
}
.dp-conn-chip:hover{
  background:var(--chip-color,#acaaff);color:var(--bg-deep);
}

/* Responsive tweaks */
@media(max-width:900px){
  #detail-panel{width:320px;min-width:320px;max-width:320px;}
}
</style>
</head>
<body>
<div id="app">
  <header id="app-header">
    <div class="header-top">
      <h1 class="app-title">
        <span class="donut-emoji">🍩</span> Ilya's 30 Papers
        <span class="app-subtitle">Research Evolution Tree</span>
      </h1>
      <div class="zoom-controls">
        <button class="zoom-btn" id="btn-zoom-out">−</button>
        <span class="zoom-label" id="zoom-label">100%</span>
        <button class="zoom-btn" id="btn-zoom-in">+</button>
        <button class="zoom-btn" style="font-size:11px;width:auto;padding:0 8px;" id="btn-zoom-reset">Reset</button>
      </div>
    </div>
    <div class="filter-bar" id="filter-bar"></div>
  </header>

  <div id="app-body">
    <div id="canvas-outer">
      <div id="canvas-scroller">
        <div id="canvas-size-shim">
          <div id="canvas">
            <svg id="connections-svg" xmlns="http://www.w3.org/2000/svg"></svg>
            <div id="year-axis"></div>
            <div id="thread-lanes"></div>
            <div id="nodes-layer"></div>
          </div>
        </div>
      </div>
    </div>

    <div id="detail-panel">
      <div id="detail-empty">
        <div class="empty-icon">🔬</div>
        <p>Click any node to explore a paper</p>
        <p class="hint">✨ Pulsing nodes have active 2025–2026 frontiers</p>
      </div>
      <div id="detail-content"></div>
    </div>
  </div>
</div>

<div id="tooltip"></div>

<script>
// =========================================================
// DATA
// =========================================================

const THREADS = [
  { id: 1, name: 'Attention & Transformers', short: 'Attention', color: '#588afd' },
  { id: 2, name: 'Vision', short: 'Vision', color: '#0dc95c' },
  { id: 3, name: 'Sequence Models & Language', short: 'Sequence', color: '#acaaff' },
  { id: 4, name: 'Optimization', short: 'Optimization', color: '#fea149' },
  { id: 5, name: 'Reasoning & Memory', short: 'Memory', color: '#f17421' },
  { id: 6, name: 'Generative Models', short: 'Generative', color: '#ec4d4d' },
  { id: 7, name: 'Scaling & Emergence', short: 'Scaling', color: '#01a78b' },
  { id: 8, name: 'Meta / Philosophy', short: 'Meta', color: '#d4d4f5' },
];

const PAPERS = [
  {
    id:1,num:'01',title:'The Annotated Transformer',year:2018,thread:1,
    summary:'Line-by-line pedagogical PyTorch implementation making the Transformer mechanistically clear.',
    origin:'Sasha Rush and Harvard NLP created a line-by-line pedagogical re-implementation of "Attention Is All You Need" in PyTorch with inline commentary. Ilya included it because understanding the Transformer mechanistically — not just using it — is essential. The annotated form forces readers to understand every tensor operation, building intuition that abstractions hide.',
    evolution:[
      {year:2018,text:'Published; became the de facto tutorial for learning the Transformer architecture'},
      {year:2020,text:'Updated to reflect pre-LayerNorm convention and integrated BERT/GPT-2 insights'},
      {year:2022,text:'v2 updated for modern PyTorch idioms; extended for GPT-2 and T5'},
      {year:2023,text:'Community forks added Flash Attention, multi-query attention, RoPE positional encoding'},
      {year:2025,text:'"Annotated" genre spread: Mamba, Llama 3, DeepSeek — format became a pedagogical standard'},
    ],
    frontier:'The teaching tradition it started is the active frontier. Modern equivalents: Karpathy\'s nanoGPT, annotated Llama 2. Used to explain Flash Attention 3, GQA, KV cache management, and Mamba SSM blocks.',
    connected:[14,15,4],frontierActive:false,
  },
  {
    id:2,num:'02',title:'The First Law of Complexodynamics',year:2011,thread:8,
    summary:'Connects computational complexity to thermodynamics — frames what "complex" means for neural learning.',
    origin:'Scott Aaronson\'s blog post argues that a complex state (neither maximally ordered nor disordered) must first increase then decrease in complexity over time. Ilya included it because it frames a deep question about what complexity means — central to understanding what neural networks are learning and what intelligence is.',
    evolution:[
      {year:2011,text:'Aaronson\'s blog post; a thought experiment about physics and computation'},
      {year:2016,text:'Connection to Kolmogorov complexity and MDL starts appearing in ML literature'},
      {year:2020,text:'Ilya Sutskever publicly cites this in discussions about neural network understanding'},
      {year:2022,text:'Grokking paper implicitly touches this — delayed generalization as a complexity phase transition'},
      {year:2024,text:'Mechanistic interpretability researchers use complexity/circuit analysis to understand grokking'},
    ],
    frontier:'Connects to mechanistic interpretability (Anthropic interpretability team) and complexity as a lens for alignment. If you can measure the complexity of what a model represents, you can audit it. Resonates with the 2025 debate: "does scaling give understanding or just pattern matching?"',
    connected:[6,23,24],frontierActive:true,
  },
  {
    id:3,num:'03',title:'Unreasonable Effectiveness of RNNs',year:2015,thread:3,
    summary:'Demonstrated character-level RNNs can generate code, Shakespeare, and LaTeX — proving sequence models learn deep structure.',
    origin:'Andrej Karpathy\'s blog post demonstrated that character-level LSTMs could generate syntactically plausible code, Shakespeare, Wikipedia markup, and LaTeX proofs — surprising everyone with how much sequential structure they could learn from raw text. Ilya included it as a visceral proof-of-concept that sequence models can learn deep structure from data alone.',
    evolution:[
      {year:2015,text:'Karpathy\'s blog post published; char-rnn becomes viral, inspiring thousands'},
      {year:2017,text:'OpenAI sentiment neuron: LSTMs learn interpretable features (single neuron tracking sentiment)'},
      {year:2019,text:'GPT-2 and GPT-3 vindicate the key insight: scale up autoregressive prediction → emergent capabilities'},
      {year:2023,text:'Karpathy\'s nanoGPT and makemore continue the same pedagogical mission with transformers'},
    ],
    frontier:'The "unreasonable effectiveness" thesis is now established fact at scale. The frontier: what else is unreasonably effective? Video tokens, audio tokens, action tokens in robotics (RT-2, π0). Mamba/SSM models revisit whether O(n) sequence models can match transformer quality.',
    connected:[4,5,25,14,22],frontierActive:false,
  },
  {
    id:4,num:'04',title:'Understanding LSTM Networks',year:2015,thread:3,
    summary:'Canonical visual explanation of LSTM gates — why cell state highways solve vanishing gradients.',
    origin:'Christopher Olah\'s blog post provided the clearest visual explanation of LSTM gates (forget, input, output, cell state) using hand-drawn diagrams. Ilya included it because architectural intuition matters — understanding why LSTM solves vanishing gradients through cell state highways gives a design principle, not just a formula.',
    evolution:[
      {year:2015,text:'Blog post published; becomes the reference LSTM explanation for years'},
      {year:2016,text:'Gate design principle spreads: GRU, Highway Networks, ResNet skip connections share the same intuition'},
      {year:2017,text:'Transformer replaces LSTM for NLP, but gate intuition lives on in GLU (Gated Linear Units)'},
      {year:2020,text:'LSTMs in on-device models; GRU in streaming speech models'},
      {year:2024,text:'xLSTM (Hochreiter group): explicit LSTM revival with matrix memory cells at scale'},
    ],
    frontier:'LSTMs themselves are niche; but design principles are very alive. Mamba-2 (2024) unifies SSMs and attention. RWKV-7 (2025): pure RNN at billion-scale, competitive on long sequences. The forget gate intuition directly informs KV cache eviction policies in long-context transformers.',
    connected:[3,5,11,20],frontierActive:false,
  },
  {
    id:5,num:'05',title:'RNN Regularization',year:2014,thread:3,
    summary:'Dropout only on non-recurrent connections makes LSTMs practical — co-authored by Ilya Sutskever.',
    origin:'Zaremba, Sutskever, and Vinyals showed that applying dropout only to non-recurrent connections dramatically improves LSTM language model performance. Ilya co-authored this — he included it because getting training to work is as important as the architecture. A masterclass in closing the gap between a good idea and a working system.',
    evolution:[
      {year:2014,text:'Paper published; LSTM dropout becomes standard practice for all sequence modeling'},
      {year:2016,text:'Variational Dropout (Gal & Ghahramani) provided theoretical grounding — dropout as Bayesian inference'},
      {year:2017,text:'Zoneout: applying dropout idea to recurrent state directly'},
      {year:2019,text:'AWD-LSTM achieved state-of-the-art language modeling with heavily tuned LSTM + dropout'},
      {year:2020,text:'Transformer dominance reduced practical relevance; dropout in transformers carries the intuition forward'},
    ],
    frontier:'Stochastic Depth (DropPath) — randomly drop entire residual blocks during training, used in ViTs. DropKey/DropToken in vision transformers. Large models are less prone to overfitting, making dropout less critical; but remains important for smaller models and fine-tuning.',
    connected:[4,29,3,14],frontierActive:false,
  },
  {
    id:6,num:'06',title:'Keeping Networks Simple (MDL)',year:1993,thread:8,
    summary:'Hinton\'s MDL paper: train networks by minimizing description length — compression is learning.',
    origin:'Geoffrey Hinton and Drew van Camp proposed training neural networks by minimizing the description length (MDL) of weights and data misfit — Bayesian compression. This framed regularization as compression: a simpler model that fits the data is preferred because it encodes less information. Ilya included it because MDL is a foundational way to think about what learning is.',
    evolution:[
      {year:1993,text:'Paper published; ahead of its time — neural networks weren\'t yet practical enough'},
      {year:2000,text:'MDL became a framework in Bayesian ML; PAC-Bayes bounds connected compression to generalization'},
      {year:2017,text:'Distillation and model compression work revisit this; lottery tickets as compression statements'},
      {year:2022,text:'Quantization (GPTQ, AWQ, GGUF) — compressing billion-parameter models to 4-bit is MDL in practice'},
      {year:2024,text:'1-bit LLMs (BitNet): extreme compression with ternary weights {-1, 0, +1}'},
    ],
    frontier:'Quantization-aware training (QAT) and post-training quantization (PTQ) are standard. Llama 3 in 4-bit runs on laptops. DeepSeek-R1 distilled into smaller models is explicit MDL. Information-theoretic generalization bounds active in learning theory.',
    connected:[2,23,5,29,22],frontierActive:false,
  },
  {
    id:7,num:'07',title:'Pointer Networks',year:2015,thread:1,
    summary:'Attention as a pointer mechanism to select input elements — solves structured combinatorial problems.',
    origin:'Vinyals, Fortunato, and Jaitly showed that attention can be used as a pointer mechanism to select elements from the input sequence — solving problems like the Traveling Salesman Problem where the output is a permutation of inputs. Ilya included it because Pointer Networks demonstrate attention as a general computational primitive.',
    evolution:[
      {year:2015,text:'Published; directly inspired copy mechanisms in NLP summarization/dialogue'},
      {year:2016,text:'Copy mechanism applied to dialogue systems and summarization — widely used in NLP pipelines'},
      {year:2017,text:'Transformer\'s cross-attention is essentially a generalized pointer'},
      {year:2022,text:'Pointer networks revived for code generation (pointing to variable names in context)'},
      {year:2024,text:'Neural Combinatorial Optimization uses attention-based models for TSP, VRP, scheduling'},
    ],

// Edges: [fromId, toId] — key influential connections
const EDGES = [
  // Thread 3 sequence chain
  [25,3],[3,4],[4,5],[5,21],
  // Thread 2 vision chain
  [8,11],[11,12],[11,16],
  // Thread 1 attention chain
  [15,7],[7,9],[15,14],[14,1],
  // Thread 5 memory chain
  [20,17],[17,19],
  // Thread 6 generative chain
  [27,18],
  // Thread 4 optimization chain
  [28,29],[29,30],
  // Thread 7 scaling chain
  [10,22],[22,24],
  // Thread 8 meta chain
  [6,23],[6,2],[23,24],
  // Cross-thread (major influences)
  [25,14], // word embeddings → transformer
  [11,14], // ResNet skip → transformer residual stream
  [8,14],  // AlexNet philosophy → transformer
  [14,22], // transformer → scaling laws
  [2,24],  // complexodynamics → grokking
  [6,24],  // MDL → grokking
  [30,11], // batchnorm → resnet (enabled deeper training)
  [4,20],  // LSTM → NTM (memory extension)
  [12,21], // dilated conv → deep speech (audio thread crossover)
  [13,14], // MPNN attention → transformer
  [9,14],  // order matters → transformer (same group)
  [29,8],  // dropout → alexnet
  [3,22],  // unreasonable effectiveness → scaling laws
  [28,27], // adam → GAN training stability
];

// =========================================================
// LAYOUT CONSTANTS
// =========================================================

const MIN_YEAR = 1993;
const MAX_YEAR = 2026;
const PX_PER_YEAR_BASE = 65;
const LABEL_W = 150;
const LANE_H = 90;
const LANE_GAP = 14;
const YEAR_AXIS_H = 38;
const PAD_RIGHT = 80;
const PAD_BOTTOM = 40;

let zoomLevel = 1.0;
let pxPerYear = PX_PER_YEAR_BASE;

function canvasW() {
  return LABEL_W + (MAX_YEAR - MIN_YEAR) * pxPerYear + PAD_RIGHT;
}
function canvasH() {
  return YEAR_AXIS_H + THREADS.length * (LANE_H + LANE_GAP) - LANE_GAP + PAD_BOTTOM;
}
function yearX(year) {
  return LABEL_W + (year - MIN_YEAR) * pxPerYear;
}
function threadY(threadIdx) {
  return YEAR_AXIS_H + threadIdx * (LANE_H + LANE_GAP) + LANE_H / 2;
}
function threadIdxById(tid) {
  return THREADS.findIndex(t => t.id === tid);
}

// Compute influence counts (incoming connections from EDGES)
function computeInfluence() {
  const counts = {};
  PAPERS.forEach(p => counts[p.id] = 0);
  EDGES.forEach(([from, to]) => {
    if (counts[to] !== undefined) counts[to]++;
  });
  // Also count from "connected" bidirectional
  PAPERS.forEach(p => {
    (p.connected || []).forEach(cid => {
      if (counts[cid] !== undefined) counts[cid]++;
    });
  });
  return counts;
}

const influence = computeInfluence();
const maxInfluence = Math.max(...Object.values(influence));

function nodeRadius(paperId) {
  const inf = influence[paperId] || 1;
  const MIN_R = 14, MAX_R = 23;
  return MIN_R + ((inf / maxInfluence) * (MAX_R - MIN_R));
}

// =========================================================
// STATE
// =========================================================

let activeThread = 0; // 0 = all
let activePaperId = null;
let nodeEls = {}; // id -> DOM element
let connEls = []; // SVG path elements
let milestoneEls = []; // milestone dot elements

// =========================================================
// BUILD UI
// =========================================================

function buildFilterTabs() {
  const bar = document.getElementById('filter-bar');
  const allBtn = document.createElement('button');
  allBtn.className = 'filter-tab active';
  allBtn.dataset.thread = '0';
  allBtn.innerHTML = 'All Papers';
  allBtn.addEventListener('click', () => setThread(0));
  bar.appendChild(allBtn);

  THREADS.forEach(t => {
    const btn = document.createElement('button');
    btn.className = 'filter-tab';
    btn.dataset.thread = String(t.id);
    btn.innerHTML = `<span class="tab-dot" style="background:${t.color}"></span>${t.short}`;
    btn.addEventListener('click', () => setThread(t.id));
    bar.appendChild(btn);
  });
}

function buildYearAxis() {
  const axis = document.getElementById('year-axis');
  axis.style.width = canvasW() + 'px';
  axis.style.height = YEAR_AXIS_H + 'px';

  // Show every 2 years, skip some for density
  const years = [];
  for (let y = 1993; y <= 2026; y++) {
    if (y <= 2000 && y % 3 !== 0) continue;
    if (y > 2000 && y < 2012 && y % 2 !== 0) continue;
    years.push(y);
  }

  years.forEach(year => {
    const mark = document.createElement('div');
    mark.className = 'year-mark';
    mark.style.left = yearX(year) + 'px';
    mark.style.top = '0';
    mark.innerHTML = `<span class="year-label">${year}</span><span class="year-tick"></span>`;
    axis.appendChild(mark);
  });
}

function buildThreadLanes() {
  const lanesEl = document.getElementById('thread-lanes');
  lanesEl.style.width = canvasW() + 'px';
  lanesEl.style.height = canvasH() + 'px';

  THREADS.forEach((thread, idx) => {
    const lane = document.createElement('div');
    lane.className = 'thread-lane';
    lane.dataset.thread = thread.id;
    const y = threadY(idx);
    lane.style.top = (y - LANE_H / 2) + 'px';
    lane.style.height = LANE_H + 'px';

    // Background stripe
    const stripe = document.createElement('div');
    stripe.style.cssText = `position:absolute;inset:0;background:${thread.color}08;border-bottom:1px solid ${thread.color}15;`;
    lane.appendChild(stripe);

    // Thread line
    const line = document.createElement('div');
    line.className = 'lane-line';
    line.style.cssText = `left:${LABEL_W}px;right:${PAD_RIGHT}px;top:${LANE_H / 2}px;background:${thread.color};opacity:0.25;`;
    lane.appendChild(line);

    // Label
    const label = document.createElement('div');
    label.className = 'lane-label';
    label.style.cssText = `color:${thread.color};height:${LANE_H}px;line-height:${LANE_H}px;width:${LABEL_W}px;background:linear-gradient(to right,#0b0b0b 75%,transparent);`;
    label.textContent = thread.short.toUpperCase();
    lane.appendChild(label);

    lanesEl.appendChild(lane);
  });
}

function buildNodes() {
  const layer = document.getElementById('nodes-layer');
  layer.style.width = canvasW() + 'px';
  layer.style.height = canvasH() + 'px';
  layer.style.position = 'absolute';
  layer.style.top = '0';
  layer.style.left = '0';

  PAPERS.forEach(paper => {
    const thread = THREADS.find(t => t.id === paper.thread);
    const tidx = threadIdxById(paper.thread);
    const x = yearX(paper.year);
    const y = threadY(tidx);
    const r = nodeRadius(paper.id);

    const el = document.createElement('div');
    el.className = 'paper-node' + (paper.frontierActive ? ' frontier-active' : '');
    el.dataset.id = paper.id;
    el.style.cssText = `
      left:${x}px;top:${y}px;
      width:${r * 2}px;height:${r * 2}px;
      --node-color:${thread.color};
      font-size:${r < 18 ? '8' : '9'}px;
    `;
    el.textContent = paper.num;

    el.addEventListener('mouseenter', e => showTooltip(paper, e));
    el.addEventListener('mousemove', e => moveTooltip(e));
    el.addEventListener('mouseleave', hideTooltip);
    el.addEventListener('click', () => selectPaper(paper.id));

    layer.appendChild(el);
    nodeEls[paper.id] = el;
  });

  // Milestone dots
  PAPERS.forEach(paper => {
    const thread = THREADS.find(t => t.id === paper.thread);
    const tidx = threadIdxById(paper.thread);
    const baseY = threadY(tidx);

    paper.evolution.forEach((evo, i) => {
      if (evo.year < MIN_YEAR || evo.year > MAX_YEAR) return;
      // Skip if same year as paper node (to avoid overlap clutter)
      if (evo.year === paper.year) return;

      const dot = document.createElement('div');
      dot.className = 'milestone-dot';
      const dotY = baseY + (i % 2 === 0 ? 22 : -22);
      dot.style.cssText = `
        left:${yearX(evo.year)}px;top:${dotY}px;
        background:${thread.color};opacity:0.4;
      `;
      dot.title = `[${paper.num}] ${evo.year}: ${evo.text}`;
      dot.dataset.paperId = paper.id;

      dot.addEventListener('mouseenter', e => {
        showMilestoneTooltip(paper, evo, e);
      });
      dot.addEventListener('mousemove', e => moveTooltip(e));
      dot.addEventListener('mouseleave', hideTooltip);

      layer.appendChild(dot);
      milestoneEls.push(dot);
    });
  });
}

function buildConnections() {
  const svg = document.getElementById('connections-svg');
  svg.setAttribute('width', canvasW());
  svg.setAttribute('height', canvasH());
  svg.style.width = canvasW() + 'px';
  svg.style.height = canvasH() + 'px';

  // Build paper lookup
  const paperMap = {};
  PAPERS.forEach(p => paperMap[p.id] = p);

  // Deduplicate edges
  const seen = new Set();
  const allEdges = [...EDGES];

  allEdges.forEach(([fromId, toId]) => {
    const key = `${Math.min(fromId,toId)}-${Math.max(fromId,toId)}`;
    if (seen.has(key)) return;
    seen.add(key);

    const from = paperMap[fromId];
    const to = paperMap[toId];
    if (!from || !to) return;

    const fromThread = THREADS.find(t => t.id === from.thread);
    const toThread = THREADS.find(t => t.id === to.thread);
    if (!fromThread || !toThread) return;

    const x1 = yearX(from.year);
    const y1 = threadY(threadIdxById(from.thread));
    const x2 = yearX(to.year);
    const y2 = threadY(threadIdxById(to.thread));

    const sameThread = from.thread === to.thread;
    const midColor = sameThread ? fromThread.color : fromThread.color;

    // Build bezier path
    let d;
    if (sameThread) {
      const cx = (x1 + x2) / 2;
      const cy = y1 - 28;
      d = `M ${x1} ${y1} Q ${cx} ${cy} ${x2} ${y2}`;
    } else {
      const dx = (x2 - x1);
      const cx1 = x1 + dx * 0.4;
      const cx2 = x2 - dx * 0.4;
      d = `M ${x1} ${y1} C ${cx1} ${y1} ${cx2} ${y2} ${x2} ${y2}`;
    }

    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', d);
    path.setAttribute('class', `conn-path ${sameThread ? 'conn-same' : 'conn-cross'}`);
    path.setAttribute('stroke', midColor);
    path.setAttribute('stroke-opacity', sameThread ? '0.3' : '0.2');
    path.dataset.from = fromId;
    path.dataset.to = toId;
    path.dataset.sameThread = sameThread ? '1' : '0';
    path.dataset.thread = from.thread;

    svg.appendChild(path);
    connEls.push(path);
  });
}

// =========================================================
// INTERACTIONS
// =========================================================

function setThread(tid) {
  activeThread = tid;

  // Update tabs
  document.querySelectorAll('.filter-tab').forEach(btn => {
    btn.classList.toggle('active', parseInt(btn.dataset.thread) === tid);
  });

  // Update node visibility
  Object.entries(nodeEls).forEach(([id, el]) => {
    const paper = PAPERS.find(p => p.id === parseInt(id));
    const visible = tid === 0 || paper.thread === tid;
    el.classList.toggle('faded', !visible);
  });

  // Update lane visibility
  document.querySelectorAll('.thread-lane').forEach(lane => {
    const ltid = parseInt(lane.dataset.thread);
    lane.classList.toggle('hidden', tid !== 0 && ltid !== tid);
  });

  // Update connection visibility
  connEls.forEach(path => {
    const ft = parseInt(path.dataset.thread);
    const visible = tid === 0 || ft === tid;
    path.classList.toggle('faded', !visible);
    if (visible) {
      path.setAttribute('stroke-opacity', path.dataset.sameThread === '1' ? '0.3' : '0.2');
    }
  });

  // Update milestone dots
  milestoneEls.forEach(dot => {
    const pid = parseInt(dot.dataset.paperId);
    const paper = PAPERS.find(p => p.id === pid);
    const visible = tid === 0 || paper.thread === tid;
    dot.classList.toggle('faded', !visible);
  });

  // If active paper not in this thread, deselect
  if (activePaperId) {
    const paper = PAPERS.find(p => p.id === activePaperId);
    if (tid !== 0 && paper.thread !== tid) {
      deselectPaper();
    }
  }
}

function selectPaper(paperId) {
  const paper = PAPERS.find(p => p.id === paperId);
  if (!paper) return;

  activePaperId = paperId;

  // Highlight selected node
  Object.entries(nodeEls).forEach(([id, el]) => {
    const iid = parseInt(id);
    const isActive = iid === paperId;
    const isConnected = paper.connected.includes(iid);
    el.classList.toggle('active', isActive);
    el.classList.toggle('faded', !isActive && !isConnected && activeThread === 0);
    if (isConnected || isActive) el.classList.remove('faded');
  });

  // Highlight relevant connections
  const connectedIds = new Set([paperId, ...paper.connected]);
  connEls.forEach(path => {
    const fid = parseInt(path.dataset.from);
    const tid = parseInt(path.dataset.to);
    const relevant = connectedIds.has(fid) && connectedIds.has(tid);
    if (relevant) {
      path.classList.add('highlighted');
      path.classList.remove('faded');
      path.setAttribute('stroke-opacity', '0.9');
    } else {
      path.classList.remove('highlighted');
      path.setAttribute('stroke-opacity', '0.06');
    }
  });

  renderDetailPanel(paper);
}

function deselectPaper() {
  activePaperId = null;

  Object.values(nodeEls).forEach(el => {
    el.classList.remove('active', 'faded');
  });

  connEls.forEach(path => {
    path.classList.remove('highlighted', 'faded');
    path.setAttribute('stroke-opacity', path.dataset.sameThread === '1' ? '0.3' : '0.2');
  });

  document.getElementById('detail-content').style.display = 'none';
  document.getElementById('detail-empty').style.display = 'flex';

  // Re-apply thread filter
  if (activeThread !== 0) setThread(activeThread);
}

function renderDetailPanel(paper) {
  const thread = THREADS.find(t => t.id === paper.thread);
  const content = document.getElementById('detail-content');
  const empty = document.getElementById('detail-empty');

  empty.style.display = 'none';
  content.style.display = 'block';

  content.style.setProperty('--dp-color', thread.color);

  const connChips = (paper.connected || []).map(cid => {
    const cp = PAPERS.find(p => p.id === cid);
    if (!cp) return '';
    const ct = THREADS.find(t => t.id === cp.thread);
    return `<button class="dp-conn-chip" data-id="${cid}" style="--chip-color:${ct.color}" title="${cp.title}">[${cp.num}] ${cp.num === cp.num ? cp.title.split(' ').slice(0,3).join(' ') + '…' : ''}</button>`;
  }).join('');

  const evoItems = paper.evolution.map(e =>
    `<li class="dp-evo-item"><span class="dp-evo-year">${e.year}</span><span class="dp-evo-text">${e.text}</span></li>`
  ).join('');

  content.innerHTML = `
    <div class="dp-header">
      <div class="dp-header-top">
        <div class="dp-num">[${paper.num}]</div>
        <div style="flex:1">
          <h2 class="dp-title">${paper.title}</h2>
          <div class="dp-meta">
            <span class="dp-year">${paper.year}</span>
            <span class="dp-thread-badge">${thread.short}</span>
            ${paper.frontierActive ? '<span class="dp-frontier-badge">🔮 Active Frontier</span>' : ''}
          </div>
        </div>
        <button class="dp-close" id="dp-close">×</button>
      </div>
    </div>
    <div class="dp-summary">${paper.summary}</div>
    <div class="dp-section">
      <div class="dp-section-title">🌱 Origin</div>
      <div class="dp-section-body">${paper.origin}</div>
    </div>
    <div class="dp-section">
      <div class="dp-section-title">📈 Evolution</div>
      <ul class="dp-evolution">${evoItems}</ul>
    </div>
    <div class="dp-section">
      <div class="dp-section-title">🔮 2025–2026 Frontier</div>
      <div class="dp-section-body">${paper.frontier}</div>
    </div>
    ${paper.connected && paper.connected.length ? `
    <div class="dp-section">
      <div class="dp-section-title">🔗 Connected Papers</div>
      <div class="dp-connected">${connChips}</div>
    </div>` : ''}
  `;

  document.getElementById('dp-close').addEventListener('click', deselectPaper);
  content.querySelectorAll('.dp-conn-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      const cid = parseInt(chip.dataset.id);
      selectPaper(cid);
      scrollToNode(cid);
    });
  });

  content.scrollTop = 0;
}

// =========================================================
// TOOLTIP
// =========================================================

const tooltip = document.getElementById('tooltip');

function showTooltip(paper, e) {
  const thread = THREADS.find(t => t.id === paper.thread);
  tooltip.innerHTML = `
    <div class="tt-num">[${paper.num}]</div>
    <div class="tt-title">${paper.title}</div>
    <div class="tt-year">${paper.year}</div>
    <div class="tt-summary">${paper.summary}</div>
    <div class="tt-thread" style="color:${thread.color}">${thread.name}</div>
  `;
  tooltip.classList.add('visible');
  moveTooltip(e);
}

function showMilestoneTooltip(paper, evo, e) {
  const thread = THREADS.find(t => t.id === paper.thread);
  tooltip.innerHTML = `
    <div class="tt-num">[${paper.num}] Milestone</div>
    <div class="tt-title">${paper.title}</div>
    <div class="tt-year">${evo.year}</div>
    <div class="tt-summary">${evo.text}</div>
  `;
  tooltip.classList.add('visible');
  moveTooltip(e);
}

function moveTooltip(e) {
  const vw = window.innerWidth, vh = window.innerHeight;
  const tw = 260, th = 120;
  let x = e.clientX + 12, y = e.clientY + 12;
  if (x + tw > vw) x = e.clientX - tw - 12;
  if (y + th > vh) y = e.clientY - th - 12;
  tooltip.style.left = x + 'px';
  tooltip.style.top = y + 'px';
}

function hideTooltip() {
  tooltip.classList.remove('visible');
}

// =========================================================
// SCROLL TO NODE
// =========================================================

function scrollToNode(paperId) {
  const paper = PAPERS.find(p => p.id === paperId);
  if (!paper) return;
  const scroller = document.getElementById('canvas-scroller');
  const x = yearX(paper.year);
  const tidx = threadIdxById(paper.thread);
  const y = threadY(tidx);
  scroller.scrollTo({
    left: Math.max(0, x * zoomLevel - scroller.clientWidth / 2),
    top: Math.max(0, y * zoomLevel - scroller.clientHeight / 2),
    behavior: 'smooth'
  });
}

// =========================================================
// ZOOM
// =========================================================

function setZoom(z) {
  zoomLevel = Math.min(2.0, Math.max(0.5, z));
  pxPerYear = PX_PER_YEAR_BASE * zoomLevel;
  document.getElementById('zoom-label').textContent = Math.round(zoomLevel * 100) + '%';

  rebuildCanvas();
}

function rebuildCanvas() {
  // Clear and rebuild
  document.getElementById('connections-svg').innerHTML = '';
  document.getElementById('year-axis').innerHTML = '';
  document.getElementById('thread-lanes').innerHTML = '';
  document.getElementById('nodes-layer').innerHTML = '';
  connEls = [];
  milestoneEls = [];
  nodeEls = {};

  const cw = canvasW();
  const ch = canvasH();

  const canvas = document.getElementById('canvas');
  canvas.style.width = cw + 'px';
  canvas.style.height = ch + 'px';

  const shim = document.getElementById('canvas-size-shim');
  shim.style.width = cw + 'px';
  shim.style.height = ch + 'px';

  buildYearAxis();
  buildThreadLanes();
  buildConnections();
  buildNodes();

  // Re-apply current filter
  if (activeThread !== 0) setThread(activeThread);
  if (activePaperId) {
    const paper = PAPERS.find(p => p.id === activePaperId);
    if (paper) selectPaper(paper.id);
  }
}

// Wheel zoom
document.getElementById('canvas-scroller').addEventListener('wheel', e => {
  if (e.ctrlKey || e.metaKey) {
    e.preventDefault();
    const delta = e.deltaY < 0 ? 0.1 : -0.1;
    setZoom(zoomLevel + delta);
  }
}, { passive: false });

document.getElementById('btn-zoom-in').addEventListener('click', () => setZoom(zoomLevel + 0.1));
document.getElementById('btn-zoom-out').addEventListener('click', () => setZoom(zoomLevel - 0.1));
document.getElementById('btn-zoom-reset').addEventListener('click', () => setZoom(1.0));

// =========================================================
// KEYBOARD
// =========================================================

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') deselectPaper();
  if (e.key === '+' || e.key === '=') setZoom(zoomLevel + 0.1);
  if (e.key === '-') setZoom(zoomLevel - 0.1);
});

// =========================================================
// INIT
// =========================================================

buildFilterTabs();

const cw = canvasW();
const ch = canvasH();

const canvas = document.getElementById('canvas');
canvas.style.width = cw + 'px';
canvas.style.height = ch + 'px';
canvas.style.position = 'relative';

const shim = document.getElementById('canvas-size-shim');
shim.style.width = cw + 'px';
shim.style.height = ch + 'px';
shim.style.position = 'relative';

buildYearAxis();
buildThreadLanes();
buildConnections();
buildNodes();

// Scroll to ~2014 on load (interesting middle area)
requestAnimationFrame(() => {
  const scroller = document.getElementById('canvas-scroller');
  scroller.scrollLeft = Math.max(0, yearX(2014) - scroller.clientWidth / 3);
});
</script>
</body>
</html>
